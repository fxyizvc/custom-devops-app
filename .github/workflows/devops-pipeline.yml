name: DevOps Automation Build

on:
  push:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Verify Code file exists
      run: ls -la

    - name: Build Docker Container
      run: docker build -t test-image .
